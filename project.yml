# XcodeGen spec for 搜题平台 iOS App
# 用法（在你的 Mac 上）：
#   1) brew install xcodegen
#   2) cd ios-app && xcodegen generate
#   3) open SearchBank.xcodeproj  (或双击)
#   4) 选择 Target「SearchBank」→ Signing & Capabilities → Team 选你已有的苹果证书
#   5) 连接 iPhone 运行，或 Product → Archive → Distribute App 导出 IPA
name: SearchBank
options:
  bundleIdPrefix: com.searchbank
  deploymentTarget:
    iOS: "15.0"  # 15.0+：WKOpenPanelParameters 引入版本；iOS 14 国内几乎已无用户
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.20.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.searchbank.app
    PRODUCT_NAME: SearchBank
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # 把下方空字符串改成你的 10 位 Apple Team ID；也可在 Xcode 的 Signing 里直接选 Team
    DEVELOPMENT_TEAM: ""
    INFOPLIST_FILE: SearchBank/Info.plist
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_BITCODE: "NO"
    SUPPORTS_MACCATALYST: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: "YES"
    # Xcode 16+ 会为资源目录生成 Swift/ObjC 符号，编译时需要模拟器运行时；
    # 在无模拟器的 CI 构建机上会导致 ARCHIVE FAILED。关闭它即可正常归档。
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
    ENABLE_ASSET_SYMBOL_GENERATION: "NO"
    # Xcode 26 编译资源目录会生成「thinned(按设备精简)」变体，需要已安装的模拟器运行时；
    # CI 构建机若没有匹配 SDK 的运行时就会 ARCHIVE FAILED。关闭 ODR 与仅编译当前架构资源可规避。
    ENABLE_ON_DEMAND_RESOURCES: "NO"
    ENABLE_ONLY_ACTIVE_RESOURCES: "YES"
    # WKWebView 需开启运行时对 JIT/内联脚本的支持（iOS 14 默认开，显式声明更稳妥）
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
targets:
  SearchBank:
    type: application
    platform: iOS
    sources:
      - path: SearchBank
      - path: www
        buildPhase: resources
        folder: reference          # 作为「文件夹引用」打进 App，保留 www/ 内部结构（index.html、app-bridge.js、搜题题库.json）
        excludes:
          - "**/.DS_Store"
    postBuildScripts:
      # 兜底：确保 www 以「目录」形式存在于 App 包根目录。
      # 某些 Xcode/XcodeGen 组合会把 folder reference 扁平化复制成散文件，
      # 导致运行时 Bundle.main.url(forResource: "www") 返回 nil（"找不到 www 资源目录"）。
      # 本脚本在 Copy Bundle Resources 之后执行，强制整体复制 www/ 目录，与 folder reference 互为冗余。
      - name: Copy www folder into app bundle
        basedOnDependencyAnalysis: false
        script: |
          set -e
          WWW_SRC="$SRCROOT/www"
          WWW_DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/www"
          if [ ! -d "$WWW_SRC" ]; then
            echo "warning: www source dir missing at $WWW_SRC"
            exit 0
          fi
          case "$WWW_DST" in
            *".app"*|*".appex"*|*".framework"*) ;;
            *) echo "error: unexpected bundle path: $WWW_DST"; exit 1 ;;
          esac
          rm -rf "$WWW_DST"
          mkdir -p "$WWW_DST"
          cp -R "$WWW_SRC/." "$WWW_DST/"
          echo "www copied -> $WWW_DST ($(du -sh "$WWW_DST" 2>/dev/null | cut -f1))"
    settings:
      base:
        INFOPLIST_FILE: SearchBank/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
