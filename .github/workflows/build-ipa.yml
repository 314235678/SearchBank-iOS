name: Build Unsigned IPA

on:
  workflow_dispatch:        # 允许在 GitHub 网页上手动点「Run workflow」
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14        # v2.13 改用 macos-14 队列（macos-latest 临时不可用/排队过长）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 选最新的 Xcode（macos-latest runner 默认装 15.4，xcodegen 最新版生成 format 77 不兼容 15.4）
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "未找到 Xcode，列出 /Applications："
            ls -1 /Applications
            exit 1
          fi
          echo "使用 Xcode：$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install iOS Simulator Runtime (编译资源目录需要, 与 SDK 匹配)
        run: |
          echo "已安装的模拟器运行时："
          xcrun simctl runtime list || true
          echo "==> 下载与当前 SDK 匹配的 iOS 模拟器运行时 ..."
          # 下载与当前 SDK 匹配的 iOS 模拟器运行时（不写 -architectureVariant，那个参数只对部分子命令有效，
          # 在新版 xcodebuild 的 -downloadPlatform 下会报 "invalid option" 直接拒绝）
          xcodebuild -downloadPlatform iOS 2>&1 \
            || sudo xcodebuild -downloadPlatform iOS 2>&1 \
            || echo "WARN: 运行时下载失败，继续尝试（可能 ODR 关闭已规避 thinned 变体）"
          echo "==> 下载后运行时列表："
          xcrun simctl runtime list || true

      - name: Install xcodegen
        run: |
          # 锁版本：2.45.x 默认生成 Xcode project format 77，Xcode 15 拒收；
          # 2.42.0 仍维护并生成兼容格式（format 56），对最新 xcode 也能 work
          brew install xcodegen@2.42.0 || brew install xcodegen
          xcodegen --version

      - name: Build unsigned IPA
        run: bash build_unsigned_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchBank-unsigned-ipa
          path: SearchBank.ipa
