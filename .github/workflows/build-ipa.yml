name: Build Unsigned IPA

on:
  workflow_dispatch:        # 允许在 GitHub 网页上手动点「Run workflow」
    inputs:
      # 设备打包(iphoneos)不需要模拟器运行时，默认跳过以下载省下数分钟/数 GB。
      # 若归档报错提示缺少运行时，可在此手动勾选 true 再跑一次。
      download_sim_runtime:
        description: '下载 iOS 模拟器运行时(仅真机打包一般不需要，默认跳过以提速)'
        type: boolean
        required: false
        default: false
  push:
    branches: [ main, master ]

# 同一分支只保留最新一次构建，避免排队堆积、浪费额度
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14        # macOS 14 队列，Xcode 版本与 xcodegen 2.42.0(format 56)兼容
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 选最新的 Xcode（macos-latest runner 默认装 15.4，xcodegen 最新版生成 format 77 不兼容 15.4）
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "未找到 Xcode，列出 /Applications："
            ls -1 /Applications
            exit 1
          fi
          echo "使用 Xcode：$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install iOS Simulator Runtime (默认跳过)
        if: ${{ inputs.download_sim_runtime }}
        run: |
          echo "==> 下载与当前 SDK 匹配的 iOS 模拟器运行时 ..."
          xcodebuild -downloadPlatform iOS 2>&1 \
            || sudo xcodebuild -downloadPlatform iOS 2>&1 \
            || echo "WARN: 运行时下载失败，继续尝试（可能 ODR 关闭已规避 thinned 变体）"
          echo "==> 下载后运行时列表："
          xcrun simctl runtime list || true

      - name: Install xcodegen
        run: |
          # 锁版本：2.45.x 默认生成 Xcode project format 77，Xcode 15 拒收；
          # 2.42.0 仍维护并生成兼容格式（format 56），对最新 xcode 也能 work
          brew install xcodegen@2.42.0 || brew install xcodegen
          xcodegen --version

      - name: Build unsigned IPA
        run: bash build_unsigned_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchBank-unsigned-ipa
          path: SearchBank.ipa
          retention-days: 7     # 一周足够取用，避免长期占用存储
