name: Build Unsigned IPA

on:
  workflow_dispatch:        # 允许在 GitHub 网页上手动点「Run workflow」
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest   # 必须 macOS：只有它有 Xcode / iOS SDK 才能编译出 arm64 二进制
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "未找到 Xcode，列出 /Applications："
            ls -1 /Applications
            exit 1
          fi
          echo "使用 Xcode：$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install iOS Simulator Runtime (编译资源目录需要, 与 SDK 匹配)
        run: |
          echo "已安装的模拟器运行时："
          xcrun simctl runtime list || true
          echo "==> 下载与当前 SDK 匹配的 iOS 模拟器运行时 ..."
          # 先试免 sudo，失败再用 sudo；下载需联网且占用数 GB 空间
          xcodebuild -downloadPlatform iOS -architectureVariant arm64 2>&1 \
            || sudo xcodebuild -downloadPlatform iOS -architectureVariant arm64 2>&1 \
            || echo "WARN: 运行时下载失败，继续尝试（可能 ODR 关闭已规避 thinned 变体）"
          echo "==> 下载后运行时列表："
          xcrun simctl runtime list || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: bash build_unsigned_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchBank-unsigned-ipa
          path: SearchBank.ipa
